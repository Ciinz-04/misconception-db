[project]
name = "misconception-db"
version = "0.1.0"
description = "K7–K9 數學迷思概念資料庫"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sympy",
    "anthropic",
    "python-dotenv",
    "langfuse",
    "google-genai>=2.30.1",
    "openinference-instrumentation-google-genai>=1.4.13",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
python-preference = "only-managed"
